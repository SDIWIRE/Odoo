<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="#017e84"/>

  <!-- Gear (work center) -->
  <g transform="translate(64,52)" fill="#ffffff" opacity="0.95">
    <path d="M0-22 a22 22 0 1 1 0 44 a22 22 0 0 1 0-44z" fill="none" stroke="#fff" stroke-width="6"/>
    <circle r="9" fill="#017e84" stroke="#fff" stroke-width="4"/>
    <!-- Gear teeth -->
    <rect x="-4" y="-30" width="8" height="10" rx="2"/>
    <rect x="-4" y="20"  width="8" height="10" rx="2"/>
    <rect x="20"  y="-4" width="10" height="8" rx="2"/>
    <rect x="-30" y="-4" width="10" height="8" rx="2"/>
    <rect x="13"  y="-22" width="8" height="10" rx="2" transform="rotate(45 17 -17)"/>
    <rect x="-21" y="12"  width="8" height="10" rx="2" transform="rotate(45 -17 17)"/>
    <rect x="13"  y="12"  width="8" height="10" rx="2" transform="rotate(-45 17 17)"/>
    <rect x="-21" y="-22" width="8" height="10" rx="2" transform="rotate(-45 -17 -17)"/>
  </g>

  <!-- Three worker figures -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Left worker -->
    <circle cx="30" cy="92" r="7"/>
    <path d="M18 118 q0-14 12-14 t12 14z"/>
    <!-- Centre worker -->
    <circle cx="64" cy="92" r="7"/>
    <path d="M52 118 q0-14 12-14 t12 14z"/>
    <!-- Right worker -->
    <circle cx="98" cy="92" r="7"/>
    <path d="M86 118 q0-14 12-14 t12 14z"/>
  </g>
</svg>
